# TradeGuard Core Pipeline — Docker Compose
# Qdrant is shared by sanctionscope and tariffai.
# If you already have Qdrant running from tariffai's docker-compose,
# you don't need to start this one.

services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
